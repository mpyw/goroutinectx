name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # id-token: write is what the coverage upload authenticates with, in
    # place of a stored token. A job's permissions replace the workflow's
    # rather than add to them, so contents: read is restated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        go-version: ['1.25', '1.26', '1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-go${{ matrix.go-version }}
          use_oidc: true
        continue-on-error: true

  declscope:
    name: declscope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run declscope
        run: declscope ./...

  validate-schema:
    name: Validate Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate options.json schema
        working-directory: testdata/metatest
        run: go run github.com/santhosh-tekuri/jsonschema/cmd/jv@29cbed9 options.schema.json options.json

      - name: Validate test schemas (parallel)
        working-directory: testdata/metatest
        run: |
          ls tests/*.json | xargs -P 8 -I {} go run github.com/santhosh-tekuri/jsonschema/cmd/jv@29cbed9 test.schema.json {}

  metatest:
    name: Metatest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26', '1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run metatest validation
        working-directory: testdata/metatest
        run: go test -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
