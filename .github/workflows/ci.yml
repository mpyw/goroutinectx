name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # id-token: write is what the coverage upload authenticates with, in
    # place of a stored token. A job's permissions replace the workflow's
    # rather than add to them, so contents: read is restated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      # Only the push run uploads. A pull request also runs on its merge
      # commit, which holds main as it is now. Codecov files both uploads
      # under the head commit and merges them line by line, so when main
      # has moved on, two versions of a file mix and the total changes
      # with no change in the pull request (#291).
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-go${{ matrix.go-version }}
          use_oidc: true
        continue-on-error: true

  golden:
    name: Golden
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # goroot.txt holds the reports for the Go version in its first line.
      - name: Read the Go version of the golden files
        id: golden
        run: echo "go-version=$(head -1 cmd/goroutinectx/testdata/golden/goroot.txt | cut -d' ' -f2 | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.golden.outputs.go-version }}
          cache: false

      - name: Cache the golden modules
        uses: actions/cache@v6
        with:
          path: |
            .cache/golden
            ~/go/pkg/mod
            ~/.cache/go-build
          key: golden-${{ steps.golden.outputs.go-version }}-${{ hashFiles('cmd/goroutinectx/golden_test.go', 'go.sum') }}

      - name: Run the golden check
        run: GOROUTINECTX_GOLDEN=1 go test -v -count=1 -timeout=20m -run TestGolden ./cmd/goroutinectx

  declscope:
    name: declscope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up mise
        uses: jdx/mise-action@v4

      # shrink goes first: a declaration it would unexport becomes private to
      # its file, and the analyzer then judges that narrower scope.
      - name: Run declscope shrink
        run: declscope shrink ./...

      - name: Run declscope
        run: declscope ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
