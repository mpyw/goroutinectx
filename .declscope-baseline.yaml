# declscope baseline
#
# Violations recorded here are suppressed; new ones are still reported.
# Regenerate with:
#
#     declscope baseline ./...
#
# Do not edit by hand. An entry disappears when its violation is fixed, so the
# diff of a regeneration is the record of what was cleaned up.
packages:
  github.com/mpyw/goroutinectx/internal:
    qualify:
      checker:
        - Fail
        - FailWithDefer
        - OK
        - Result
      runner:
        - getCallReportPos
  github.com/mpyw/goroutinectx/internal/checkers:
    qualify:
      gotask:
        - formatMethodMessage
        - getMethodReceiver
        - ordinal
        - splitAPIName
        - taskConstructorConfig
      spawner:
        - NewConcChecker
        - NewErrgroupChecker
        - NewSpawnCallbackChecker
        - NewWaitgroupChecker
        - SpawnCallbackChecker
        - SpawnCallbackEntry
        - findFuncArgs
  github.com/mpyw/goroutinectx/internal/checkers/spawnerlabel:
    qualify:
      checker:
        - New
        - hasFuncParams
        - spawnCallInfo
  github.com/mpyw/goroutinectx/internal/deriver:
    qualify:
      deriver:
        - Matcher
        - NewMatcher
        - collectCalledFuncs
        - groupSatisfied
        - specSatisfied
  github.com/mpyw/goroutinectx/internal/directive/carrier:
    qualify:
      carrier:
        - Parse
        - matchPkg
  github.com/mpyw/goroutinectx/internal/directive/ignore:
    qualify:
      ignore:
        - Build
        - CheckerName
        - EnabledCheckers
        - Entry
        - Errgroup
        - Goroutine
        - GoroutineDerive
        - Gotask
        - Map
        - Spawner
        - Spawnerlabel
        - Waitgroup
        - parseComment
  github.com/mpyw/goroutinectx/internal/directive/spawner:
    qualify:
      spawner:
        - Build
        - Map
        - buildForFile
        - parseExternal
  github.com/mpyw/goroutinectx/internal/funcspec:
    qualify:
      funcspec:
        - ExtractFunc
        - Parse
        - Spec
        - matchPkg
        - shortPkgName
  github.com/mpyw/goroutinectx/internal/probe:
    qualify:
      assignment:
        - CallExprAssignedTo
        - CallExprAssignedToIdent
        - FuncLitAssignedTo
        - FuncLitOfIdent
        - FuncLitsAssignedTo
        - FuncLitsOfIdent
        - isInControlStructure
      capture:
        - ArgUsesContext
        - ArgsUseContext
        - FuncLitHasContextParam
        - FuncLitUsesContext
        - FuncTypeHasContextParam
        - nodeReferencesContext
      composite:
        - FuncLitOfIndex
        - FuncLitOfStructField
        - IndexExprCapturesContext
        - SelectorExprCapturesContext
        - funcLitOfFieldAssignment
        - funcLitOfIndexAssignment
        - funcLitOfLiteralKey
      factory:
        - BlockReturnsContextUsingFunc
        - funcLitAssignmentsAllUseOrReturnContext
        - returnedValueUsesContext
  github.com/mpyw/goroutinectx/internal/registry:
    qualify:
      registry:
        - Entry
        - FuncMatch
        - New
  github.com/mpyw/goroutinectx/internal/scope:
    qualify:
      scope:
        - Build
        - FindEnclosing
        - Map
  github.com/mpyw/goroutinectx/internal/ssa:
    qualify:
      builder:
        - Build
        - BuildSSAAnalyzer
        - Program
      tracer:
        - DeriverResult
        - ExtractCalledFunc
        - ExtractIIFE
        - HasFuncArgs
        - deriverCall
  github.com/mpyw/goroutinectx/internal/typeutil:
    qualify:
      typeutil:
        - IsContextType
        - UnwrapPointer
        - contextPkgPath
